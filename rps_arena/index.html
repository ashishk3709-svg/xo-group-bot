<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPS Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#25345c,#090d19 70%);color:white;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;text-align:center;background:#151d31;border:1px solid #354568;border-radius:25px;padding:25px;box-shadow:0 15px 50px #0008}
h1{font-size:30px;margin:5px;color:#8eeaff;letter-spacing:2px}
.sub{color:#aebbd3;font-size:13px}
.score{display:flex;justify-content:space-around;margin:25px 0;background:#0d1425;padding:17px;border-radius:16px}
.score strong{display:block;font-size:30px;color:#8eeaff}
.choices{display:flex;gap:12px;margin:25px 0}
.choice{flex:1;border:1px solid #455675;background:#202d48;border-radius:18px;padding:16px 5px;color:white;font-size:39px;cursor:pointer}
.choice:active{transform:scale(.94)}
.choice span{display:block;font-size:12px;margin-top:8px}
.choice:disabled{opacity:.4}
.status{min-height:65px;background:#0d1425;border-radius:15px;padding:18px;color:#c9d7f0;line-height:1.5}
button#again{margin-top:18px;padding:13px 25px;border:0;border-radius:12px;background:#4dd5ed;color:#071321;font-weight:bold;font-size:15px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>⚡ RPS ARENA</h1>
<p class="sub">ROCK • PAPER • SCISSORS</p>
<div class="score">
<div>YOU<strong id="you">0</strong></div>
<div>ROUND<strong id="round">1</strong></div>
<div>OPPONENT<strong id="opp">0</strong></div>
</div>
<h3 id="title">MAKE YOUR MOVE</h3>
<div class="choices">
<button class="choice" onclick="pick('rock')">✊<span>ROCK</span></button>
<button class="choice" onclick="pick('paper')">✋<span>PAPER</span></button>
<button class="choice" onclick="pick('scissors')">✌️<span>SCISSORS</span></button>
</div>
<div class="status" id="status">Choose your move to begin!</div>
<button id="again" class="hidden" onclick="reset()">PLAY AGAIN</button>
<p class="sub">RPS ARENA • TELEGRAM MINI APP</p>
</div>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();
let you=0,opp=0,round=1,locked=false;
function pick(choice){
 if(locked)return;
 locked=true;
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 document.getElementById('title').textContent='MOVE LOCKED 🔒';
 document.getElementById('status').textContent='Your choice: '+choice.toUpperCase()+'. Waiting for opponent...';
 tg?.sendData(JSON.stringify({type:'rps_choice',choice}));
}
function reset(){
 you=0;opp=0;round=1;locked=false;
 document.getElementById('you').textContent=0;
 document.getElementById('opp').textContent=0;
 document.getElementById('round').textContent=1;
 document.getElementById('title').textContent='MAKE YOUR MOVE';
 document.getElementById('status').textContent='Choose your move to begin!';
 document.getElementById('again').classList.add('hidden');
 document.querySelectorAll('.choice').forEach(b=>b.disabled=false);
}
</script>
</body>
</html>
